[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bucketflow"
version = "0.1.0"
description = "BucketFlow method implementation and experiments"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.7", "torch>=2.4,<2.8", "torchvision>=0.19,<0.23"]

[project.scripts]
bucketflow = "bucketflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
workloads = ["transformers>=4.51,<5", "datasets>=3,<5", "safetensors>=0.4"]
